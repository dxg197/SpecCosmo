# ranger-mvapich

# Whenever this version string changes, the application is configured
# and rebuilt from scratch
VERSION = 2009-04-11

CPP = cpp
FPP = cpp
CC  = /opt/apps/intel/10.1/cc/bin/icc
CXX = /opt/apps/intel/10.1/cc/bin/icpc
F77 = /opt/apps/intel/10.1/fc/bin/ifort
F90 = /opt/apps/intel/10.1/fc/bin/ifort

# -inline-debug-info leads to compiler crashes when used with optimisation
CPPFLAGS = -openmp -DMPICH_IGNORE_CXX_SEEK
FPPFLAGS = -traditional -D_OPENMP
CFLAGS   = -openmp -g -debug all -traceback -align -std=gnu99 -ansi_alias
CXXFLAGS = -openmp -g -debug all -traceback -align -restrict
F77FLAGS = -openmp -g -debug all -traceback -align -pad -w95 -cm
F90FLAGS = -openmp -g -debug all -traceback -align -pad -w95 -cm

C_LINE_DIRECTIVES = yes
F_LINE_DIRECTIVES = yes

LDFLAGS = -Wl,-rpath,/share/home/00920/tg459479/utils/hdf5-1.8.3.patched/lib -Wl,-rpath,/opt/apps/papi/papi-3.6.0/lib -Wl,-rpath,/opt/apps/intel10_1/acml/4.1.0/ifort64_mp/lib -Wl,-rpath,/opt/apps/intel10_1/mvapich/0.9.9/lib/shared -Wl,-rpath,/opt/apps/intel/10.1/fc/lib -Wl,-rpath,/opt/apps/gsl/1.11/lib

LIBDIRS = /opt/apps/intel/10.1/fc/lib

# -check-uninit aborts for uninitialised variables, which is too strict
DEBUG           = no
CPP_DEBUG_FLAGS = -DCARPET_DEBUG
FPP_DEBUG_FLAGS = -DCARPET_DEBUG
C_DEBUG_FLAGS   = -O0 # -check-uninit
CXX_DEBUG_FLAGS = -O0 # -check-uninit
F77_DEBUG_FLAGS = -O0 -check bounds -check format # -check all
F90_DEBUG_FLAGS = -O0 -check bounds -check format # -check all

# -O3 miscompiles parts of CarpetLib
# -ip leads to wrong physics when OpenMP is used
OPTIMISE           = yes
CPP_OPTIMISE_FLAGS = # -DCARPET_OPTIMISE -DNDEBUG
FPP_OPTIMISE_FLAGS = # -DCARPET_OPTIMISE -DNDEBUG
C_OPTIMISE_FLAGS   = -O2 -xW
CXX_OPTIMISE_FLAGS = -O2 -xW
F77_OPTIMISE_FLAGS = -O2 -xW
F90_OPTIMISE_FLAGS = -O2 -xW

PROFILE           = no
CPP_PROFILE_FLAGS =
FPP_PROFILE_FLAGS =
C_PROFILE_FLAGS   = -pg
CXX_PROFILE_FLAGS = -pg
F77_PROFILE_FLAGS = -pg
F90_PROFILE_FLAGS = -pg

WARN           = yes
CPP_WARN_FLAGS =
FPP_WARN_FLAGS =
C_WARN_FLAGS   =
CXX_WARN_FLAGS =
F77_WARN_FLAGS =
F90_WARN_FLAGS =



BLAS_DIR  = /opt/apps/intel10_1/acml/4.1.0/ifort64_mp/lib
BLAS_LIBS = acml_mp acml_mv

GSL_DIR = /opt/apps/gsl/1.11

IPM_DIR = /share/home/00507/eschnett/ipm_0.982

HDF5     = yes
HDF5_DIR = /share/home/00920/tg459479/utils/hdf5-1.8.3.patched

LAPACK      = yes
LAPACK_DIR  = /opt/apps/intel10_1/acml/4.1.0/ifort64_mp/lib
LAPACK_LIBS = acml_mp acml_mv

#CURL = /share/home/00507/eschnett/curl-7.19.4

# MVAPICH 1.0.1 has problems with 512++ MPI processes
MPI          = CUSTOM
MPI_INC_DIRS = /opt/apps/intel10_1/mvapich/0.9.9/include
MPI_LIB_DIRS = /opt/apps/intel10_1/mvapich/0.9.9/lib /opt/ofed/lib64
MPI_LIBS     = mpich pmpich ibverbs ibumad pthread pthread rt

PAPI_DIR = /opt/apps/papi/papi-3.6.0

PTHREADS = yes

#TAU_MAKEFILE = /opt/apps/intel10_1/mvapich1_1_0_1/tau/2.17/x86_64/lib/Makefile.tau-multiplecounters-icpc-mpi-papi-pdt-openmp
TAU_MAKEFILE = /share/home/00920/tg459479/utils/x86_64/lib/Makefile.tau-linuxtimers-papiwallclock-multiplecounters-icpc-mpi-papi-pdt-openmp-trace
TAUCLOCKS_MEMORY_PROFILE = 1
